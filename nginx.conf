server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The apex domain redirects to www.
    if ($host = mindmapmarkdown.org) {
        return 301 https://www.mindmapmarkdown.org$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
